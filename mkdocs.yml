site_name: SADE Docs
site_description: 코드, 명세, 로그로 API 목록과 관리 우선순위를 만드는 SADE 사용 가이드
site_url: https://bob-15th-sade.github.io/SADE-docs/
repo_url: https://github.com/BoB-15th-SADE/SADE-docs
repo_name: SADE-docs
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: ko
  logo: assets/logo.png
  favicon: assets/favicon.png
  font: false
  palette:
    scheme: default
    primary: white
    accent: teal
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/page-actions.js
  - assets/javascripts/log-check.js
  - assets/javascripts/flow-sim.js

plugins:
  - search:
      lang: [en]
  - i18n:
      docs_structure: folder
      languages:
        - locale: ko
          name: 한국어
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            시작하기: GET STARTED
            SADE 소개: Introduction
            설치와 첫 연결: Install and connect
            화면 둘러보기: Dashboard tour
            연동 가이드: INTEGRATIONS
            소스 코드 (GitHub): Source code (GitHub)
            OpenAPI 명세: OpenAPI specifications
            로그 (CSV, syslog, Kafka): Logs (CSV, syslog, Kafka)
            로그 필드: Log fields
            사용 방법: USING SADE
            관리 우선순위 (P1~P4): Management priority (P1-P4)
            API 상세: API details
            프레임워크 점검 (준비 중): Framework assessments (in preparation)
            Data Types (민감정보 유형): Data Types
            Access Scope와 Settings: Access Scope and Settings
            운영: OPERATIONS
            구성과 데이터 처리: Architecture and data handling
            문제 해결: Troubleshooting
            참고: REFERENCE
            용어: Glossary
            지원 범위와 제한: Supported scope and limits
            변경 내역: Changelog
            문서 기준: Documentation baseline

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc: {permalink: true}

extra:
  generator: false

nav:
  - 시작하기:
      - SADE 소개: index.md
      - 설치와 첫 연결: getting-started/quickstart.md
      - 화면 둘러보기: getting-started/navigation.md
  - 연동 가이드:
      - 소스 코드 (GitHub): connect/code.md
      - OpenAPI 명세: connect/specs.md
      - 로그 (CSV, syslog, Kafka): connect/logs.md
      - 로그 필드: connect/schema.md
  - 사용 방법:
      - Overview: features/overview.md
      - Inventory: features/inventory.md
      - 관리 우선순위 (P1~P4): features/priority.md
      - API 상세: features/api-details.md
      - Flows: features/flows.md
      - 프레임워크 점검 (준비 중): features/assessments.md
      - Data Types (민감정보 유형): policy/data-types.md
      - Access Scope와 Settings: policy/access-scope.md
  - 운영:
      - 구성과 데이터 처리: operations/architecture.md
      - 문제 해결: troubleshooting/index.md
  - 참고:
      - 용어: reference/glossary.md
      - 지원 범위와 제한: reference/limitations.md
      - 변경 내역: reference/changelog.md
      - 문서 기준: reference/baseline.md
